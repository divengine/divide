[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "divide"
version = "0.1.0"
description = "A terminal IDE for the Divengine projects, starting with the Div template language."
requires-python = ">=3.11"
dependencies = ["textual>=8.2,<9", "textual-vision==0.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
divide = "divide.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
divide = ["run/*.php"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
