[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "divide"
dynamic = ["version"]
description = "An IDE for developing generators with the Divengine ecosystem, in the terminal."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=8.2,<9", "textual-vision==0.0.1", "tree-sitter>=0.25", "tree-sitter-php>=0.23", "pygls>=2.1,<3",
    "tree-sitter-html>=0.23", "tree-sitter-css>=0.23", "tree-sitter-javascript>=0.23", "tree-sitter-markdown>=0.3",
    "tree-sitter-sql>=0.3.11", "tree-sitter-xml>=0.7", "tree-sitter-yaml>=0.6", "tree-sitter-toml>=0.6", "tree-sitter-bash>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "babel>=2.14"]
mcp = ["mcp>=2.3,<3"]  # divide --mcp: the official MCP SDK

[project.scripts]
divide = "divide.app:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
divide = ["run/*.php", "manual/books.json", "manual/books/*/*", "manual/search*.sqlite", "locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
