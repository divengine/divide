name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os == 'windows-latest' }}  # Windows: not supported yet, its failures say what is missing
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest  # the oldest Python divide supports
            python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: shivammathur/setup-php@v2  # php, composer and Xdebug: rendering, the debugger, Composer packages
        with:
          php-version: "8.3"
          tools: composer
          coverage: xdebug

      - name: Div for the shop example (its vendor/)
        run: composer install --no-interaction --no-progress --working-dir examples/shop

      - name: divide and the tests' tools
        run: python -m pip install -e ".[dev]"

      - name: Tests
        env:
          DIVIDE_DIV_PHP: ${{ github.workspace }}/examples/shop/vendor/autoload.php
        run: python -m pytest -q -p no:cacheprovider -rs
