name: tests

on:
  push:
    branches: [main]
    paths-ignore:  # what no test reads (a release changes VERSION and releases/, so it is still tested)
      - "docs/**"
      - "README.md"
      - "tools/screencast.py"
      - "tools/wiki_shots.py"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest  # the oldest Python divide supports
            python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: shivammathur/setup-php@v2  # php, composer and Xdebug: rendering, the debugger, Composer packages
        with:
          php-version: "8.3"
          tools: composer
          coverage: xdebug

      - name: Div for the shop example (its vendor/)
        run: composer install --no-interaction --no-progress --working-dir examples/shop

      - name: divide and the tests' tools
        run: python -m pip install -e ".[dev]"

      - name: Tests
        env:
          DIVIDE_DIV_PHP: ${{ github.workspace }}/examples/shop/vendor/autoload.php
        run: python -m pytest -q -p no:cacheprovider -rs

  release-note:
    name: A new version has its note
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: VERSION raised, releases/<version>.md written
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          before=$(git show "origin/$GITHUB_BASE_REF:VERSION" 2>/dev/null | tr -d '[:space:]' || true)
          if [ "$version" = "$before" ]; then
            echo "VERSION stays at $version."
          elif [ ! -f "releases/$version.md" ]; then
            echo "::error file=VERSION::VERSION is now $version: releases/$version.md, its release note, is missing"
            exit 1
          else
            echo "divide $version, with its note: merged into main, it is released."
          fi
