# Linux packages (deb, rpm, apk, Arch) around the standalone binary; built by .github/workflows/release.yml:
#     VERSION=0.1.0 ARCH=amd64 nfpm package --config packaging/nfpm.yaml --packager deb --target out/
name: divide
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: devel
maintainer: Divengine <https://github.com/divengine>
description: |
  A terminal IDE for the Divengine projects, starting with the Div template language.
homepage: https://github.com/divengine/divide
license: GPL-3.0-or-later
# Running and checking templates needs PHP; editing does not.
recommends:
  - php-cli
contents:
  - src: LICENSE
    dst: /usr/share/licenses/divide/LICENSE
  - src: dist/divide
    dst: /usr/bin/divide
    file_info:
      mode: 0755
  - src: packaging/appimage/divide.desktop
    dst: /usr/share/applications/divide.desktop
  - src: packaging/divide.svg
    dst: /usr/share/icons/hicolor/scalable/apps/divide.svg
